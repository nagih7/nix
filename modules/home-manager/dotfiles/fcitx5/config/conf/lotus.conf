# Lotus engine settings (migrated from unikey.conf; key names differ).
#
# Mode=Preedit is the only mode that needs nothing outside fcitx5. The uinput
# modes (Smooth/SuperSmooth/Select/Minecraft) talk to fcitx5-lotus-server over
# a socket -- that daemon is wired up in modules/nixos/features/fcitx5-lotus.nix.
Mode=Preedit
InputMethod=Telex
OutputCharset=Unicode

# unikey's ProcessWAtWordBeginning=True; lotus defaults this to Non-Start.
W2U=Everywhere

# lotus defaults SpellCheck to True.
SpellCheck=False
EnableMacro=True
