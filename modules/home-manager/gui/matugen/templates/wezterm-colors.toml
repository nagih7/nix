# WezTerm color scheme generated by matugen on each wallpaper change.
# WezTerm discovers .toml files under ~/.config/wezterm/colors/ as named
# color schemes; referenced from wezterm.lua as color_scheme = "MaterialYou".
#
# IMPORTANT: every color reference below uses .dark.hex (not .default.hex) to
# force the dark variant even when the system is in light mode. wezterm should
# look the same regardless of /light /dark, because its background is the
# wallpaper (dimmed) which only reads well with light-on-dark text.

[colors]
foreground = "{{colors.on_surface.dark.hex}}"
background = "{{colors.surface_dim.dark.hex}}"

cursor_bg = "{{colors.primary.dark.hex}}"
cursor_fg = "{{colors.on_primary.dark.hex}}"
cursor_border = "{{colors.primary.dark.hex}}"

selection_bg = "{{colors.primary_container.dark.hex}}"
selection_fg = "{{colors.on_primary_container.dark.hex}}"

ansi = [
  "{{colors.surface_container.dark.hex}}",         # 0  black
  "{{colors.error.dark.hex}}",                     # 1  red (always-red role)
  "{{colors.primary.dark.hex}}",                   # 2  green
  "{{colors.tertiary.dark.hex}}",                  # 3  yellow
  "{{colors.secondary.dark.hex}}",                 # 4  blue
  "{{colors.primary_container.dark.hex}}",         # 5  magenta
  "{{colors.tertiary_container.dark.hex}}",        # 6  cyan
  "{{colors.on_surface_variant.dark.hex}}",        # 7  white
]
brights = [
  "{{colors.outline.dark.hex}}",                   # 8  bright black
  "{{colors.error_container.dark.hex}}",           # 9  bright red
  "{{colors.primary_fixed_dim.dark.hex}}",         # 10 bright green
  "{{colors.tertiary_fixed.dark.hex}}",            # 11 bright yellow
  "{{colors.secondary_fixed_dim.dark.hex}}",       # 12 bright blue
  "{{colors.secondary_container.dark.hex}}",       # 13 bright magenta
  "{{colors.tertiary_fixed_dim.dark.hex}}",        # 14 bright cyan
  "{{colors.on_surface.dark.hex}}",                # 15 bright white
]

[metadata]
name = "MaterialYou"
author = "matugen (generated, dark-only)"
