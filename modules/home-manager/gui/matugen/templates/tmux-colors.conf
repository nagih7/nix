# Material You colors for tmux — overrides catppuccin/tmux @thm_* vars so the
# status bar follows the wallpaper. Generated by matugen on every wallpaper
# change. Sourced from .tmux.conf AFTER the catppuccin plugin loads so these
# values win.
#
# IMPORTANT: every color reference below uses .dark.hex (not .default.hex) to
# force the dark variant even when the system is in light mode. tmux runs
# inside a terminal whose background is the (dim) wallpaper, which only reads
# well with light-on-dark text — matching the wezterm dark-only treatment.

# Surfaces / neutrals (mapped from M3 surface roles → Catppuccin palette names)
set -g @thm_bg "{{colors.background.dark.hex}}"
set -g @thm_fg "{{colors.on_surface.dark.hex}}"
set -g @thm_crust "{{colors.surface_dim.dark.hex}}"
set -g @thm_mantle "{{colors.surface.dark.hex}}"
set -g @thm_base "{{colors.background.dark.hex}}"
set -g @thm_surface_0 "{{colors.surface_container_low.dark.hex}}"
set -g @thm_surface_1 "{{colors.surface_container.dark.hex}}"
set -g @thm_surface_2 "{{colors.surface_container_high.dark.hex}}"
set -g @thm_overlay_0 "{{colors.outline_variant.dark.hex}}"
set -g @thm_overlay_1 "{{colors.outline.dark.hex}}"
set -g @thm_overlay_2 "{{colors.outline.dark.hex}}"
set -g @thm_text "{{colors.on_surface.dark.hex}}"
set -g @thm_subtext_0 "{{colors.on_surface_variant.dark.hex}}"
set -g @thm_subtext_1 "{{colors.on_surface_variant.dark.hex}}"

# Accent palette (M3 roles → Catppuccin hue names — chosen for visual role,
# not literal color match; e.g. @thm_green is the primary accent regardless
# of the actual M3 primary hue, which is what derived configs expect)
set -g @thm_rosewater "{{colors.tertiary_fixed.dark.hex}}"
set -g @thm_flamingo "{{colors.tertiary_container.dark.hex}}"
set -g @thm_pink "{{colors.tertiary.dark.hex}}"
set -g @thm_mauve "{{colors.secondary.dark.hex}}"
set -g @thm_red "{{colors.error.dark.hex}}"
set -g @thm_maroon "{{colors.error_container.dark.hex}}"
set -g @thm_peach "{{colors.tertiary.dark.hex}}"
set -g @thm_yellow "{{colors.primary_fixed_dim.dark.hex}}"
set -g @thm_green "{{colors.primary.dark.hex}}"
set -g @thm_teal "{{colors.secondary_container.dark.hex}}"
set -g @thm_sky "{{colors.secondary_fixed.dark.hex}}"
set -g @thm_sapphire "{{colors.secondary_fixed_dim.dark.hex}}"
set -g @thm_blue "{{colors.primary_container.dark.hex}}"
set -g @thm_lavender "{{colors.primary_fixed.dark.hex}}"
